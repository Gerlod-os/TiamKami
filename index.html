<div id="stats-bar" class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
<div class="bg-gray-900 rounded-xl border border-gray-800 p-4 text-center">
<div class="text-3xl font-bold text-white" id="stat-total">0</div>

<div class="bg-gray-900 rounded-xl border border-green-900/30 p-4 text-center">

</div>
<div class="bg-gray-900 rounded-xl border border-red-900/30 p-4 text-center">

</div>
<div class="bg-gray-900 rounded-xl border border-purple-900/30 p-4 text-center">

</div>
</div>

<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>

</div>

<div class="flex gap-3">
<input type="text" id="search" placeholder="🔍 Поиск..."
